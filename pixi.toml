[workspace]
channels = ["conda-forge", "sjcross"]
name = "ctrap-analysis"
platforms = ["osx-64", "osx-arm64", "win-64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
jupyter = ">=1.1.1,<2"
ipympl = ">=0.9.7,<0.10"
python = ">=3.9"
imageio = ">=2.37.0,<3"
kymotools = ">=0.4.8,<0.5"
numpy = "<2"
lmfit = ">=1.3.3,<2"
sympy = ">=1.14.0,<2"

[feature.n2v.pypi-dependencies]
n2v = "<1"
tensorflow = ">=1.0,<=2.18"

[feature.pylake.dependencies]
"lumicks.pylake" = ">=1.6.2,<2"

[environments]
n2v = ["n2v"]
pylake = ["pylake"]

[pypi-dependencies]
denseweight = ">=0.1.2, <0.2"
